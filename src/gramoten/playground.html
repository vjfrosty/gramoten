<style>
  :root { --red: #d33; --blue: #2563eb; --muted: #666; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin: 0 0 1rem; font-size: 1.5rem; display: flex; align-items: center; gap: .75rem; }
  h1 img { height: 64px; width: auto; display: block; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 1rem; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: .3rem .5rem; }
  .row { display: flex; gap: .75rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }
  button { font: inherit; padding: .35rem .9rem; cursor: pointer; }
  #status { color: var(--muted); }
  label { color: var(--muted); }

  /* The editor: a transparent textarea over a backdrop that draws the underlines.
     Both share every metric so the underlines sit under the right letters. */
  .editor { position: relative; }
  .editor textarea, .editor .backdrop {
    box-sizing: border-box; width: 100%; margin: 0; padding: .6rem; border: 1px solid #bbb; border-radius: 4px;
    font: 16px/1.6 system-ui, sans-serif; letter-spacing: normal; white-space: pre-wrap; overflow-wrap: break-word;
    word-break: normal; tab-size: 4;
  }
  .editor .backdrop { position: absolute; inset: 0; color: transparent; background: #fff; overflow: hidden; pointer-events: none; }
  .editor textarea { position: relative; display: block; background: transparent; color: #222; resize: none;
                     overflow: hidden; min-height: 9rem; caret-color: #222; }
  .editor textarea:focus { outline: 2px solid #93c5fd; outline-offset: -1px; }
  mark { color: transparent; background: none; text-decoration: underline wavy; text-decoration-thickness: 1.5px;
         text-underline-offset: 3px; text-decoration-skip-ink: none; }
  mark.spelling { text-decoration-color: var(--red); }
  mark.other { text-decoration-color: var(--blue); }
  mark.quiet { text-decoration-style: dotted; }
  mark.space { background: rgba(37, 99, 235, .15); }
  mark.active { background: rgba(255, 213, 79, .55); }

  /* The popup shown under a clicked finding. */
  #pop { position: absolute; z-index: 10; min-width: 240px; max-width: 360px; background: #fff; border: 1px solid #ccc;
         border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: .6rem .7rem; font-size: 14px; }
  #pop .head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .3rem; }
  #pop .msg { color: #333; margin-bottom: .5rem; }
  #pop .wrong { text-decoration: line-through; color: var(--red); }
  #pop .opts { display: flex; flex-direction: column; gap: .25rem; }
  #pop .opts button { text-align: left; padding: .3rem .5rem; border: 1px solid #ddd; background: #f8fafc; border-radius: 4px; }
  #pop .opts button:hover { background: #e0ecff; border-color: #93c5fd; }
  #pop .opts button.fix { font-weight: 600; }
  #pop .none { color: var(--muted); font-style: italic; }
  #pop .actions { display: flex; gap: .4rem; margin-top: .5rem; border-top: 1px solid #eee; padding-top: .5rem; }
  #pop .actions button { font-size: 13px; padding: .15rem .5rem; background: none; border: 1px solid #ddd; border-radius: 4px; }
  #pop .x { border: none; background: none; font-size: 18px; line-height: 1; padding: 0 .2rem; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 14px; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f5f8ff; }
  code { background: #f1f1f1; padding: 0 .25rem; border-radius: 3px; white-space: pre; }
  .kind { font-size: 12px; padding: 0 .4rem; border-radius: 3px; color: #fff; }
  .k-spelling { background: var(--red); } .k-punctuation { background: #7c3aed; }
  .k-grammar { background: #059669; } .k-format { background: var(--blue); }
</style>

<script>
const $ = id => document.getElementById(id);
const ta = $("text"), backdrop = $("backdrop"), pop = $("pop");
const KIND = {spelling: "Правопис", punctuation: "Пунктуация", grammar: "Граматика", format: "Формат"};
let issues = [], shown = [], timer = null, seq = 0, checkedText = null;
const ignored = new Set();

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = s => esc(s).replace(/ /g, "·").replace(/\n/g, "↵");
const extraWords = () => $("extra").value.split(",").map(w => w.trim()).filter(Boolean);
const ignoreKey = i => `${i.code}|${i.text}`;

async function run() {
  const text = ta.value, mine = ++seq;
  $("status").textContent = "проверявам…";
  try {
    const r = await fetch("/check", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({text, extra: extraWords()})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    if (mine !== seq || ta.value !== text) return;   // the text changed meanwhile
    issues = data.issues.filter(i => !ignored.has(ignoreKey(i)));
    checkedText = text;
    $("status").textContent = `${issues.length} находки · ${data.ms} ms`;
    render();
  } catch (e) {
    $("status").textContent = "Грешка: " + e.message + " (работи ли сървърът?)";
  }
}

function render() {
  const text = ta.value;
  // Underline non-overlapping spans in order; the table lists every finding.
  let html = "", pos = 0;
  shown = [];
  if (text === checkedText) issues.forEach((i, n) => {
    if (i.start < pos) return;
    html += esc(text.slice(pos, i.start));
    const blank = !text.slice(i.start, i.end).trim();
    const cls = (i.kind === "spelling" ? "spelling" : "other") + (i.quiet ? " quiet" : "") + (blank ? " space" : "");
    html += `<mark class="${cls}" data-n="${n}">${esc(text.slice(i.start, i.end))}</mark>`;
    shown.push(n);
    pos = i.end;
  });
  backdrop.innerHTML = html + esc(text.slice(pos)) + "\n ";   // keeps a trailing newline's height
  fit();

  $("rows").innerHTML = text === checkedText ? issues.map((i, n) => `
    <tr data-n="${n}">
      <td>${n + 1}</td>
      <td><span class="kind k-${i.kind}">${KIND[i.kind] || i.kind}</span>${i.quiet ? " <small>(тихо)</small>" : ""}</td>
      <td><code>${esc(i.code)}</code></td>
      <td><code>${show(i.text)}</code></td>
      <td>${esc(i.message_bg || i.message)}</td>
      <td>${i.suggestions.map(s => `<code>${show(s)}</code>${i.fix === s ? " ✓" : ""}`).join(" ")}</td>
    </tr>`).join("") : "";
}

function fit() {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + 2 + "px";
}

// ---- popup ----
function issueAt(caret) {
  // The narrowest underlined finding that holds the caret.
  return shown.map(n => issues[n]).filter(i => i.start <= caret && caret <= i.end)
              .sort((a, b) => (a.end - a.start) - (b.end - b.start))[0];
}

function openPopup(i) {
  const n = issues.indexOf(i);
  const mark = backdrop.querySelector(`mark[data-n="${n}"]`);
  if (!mark) return closePopup();
  backdrop.querySelectorAll("mark.active").forEach(m => m.classList.remove("active"));
  mark.classList.add("active");

  const opts = i.suggestions.length
    ? i.suggestions.map(s => `<button data-s="${esc(s)}" class="${s === i.fix ? "fix" : ""}">${show(s) || "<i>(изтрий)</i>"}${s === i.fix ? " ✓" : ""}</button>`).join("")
    : `<div class="none">Няма предложения</div>`;
  pop.innerHTML = `
    <div class="head"><span class="kind k-${i.kind}">${KIND[i.kind] || i.kind}</span><button class="x" data-act="close" title="Затвори">×</button></div>
    <div class="msg">${esc(i.message_bg || i.message)}</div>
    <div style="margin-bottom:.4rem"><span class="wrong">${show(i.text)}</span> <small style="color:#888">${esc(i.code)}</small></div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button data-act="ignore">Игнорирай</button>
      ${i.kind === "spelling" ? `<button data-act="add">Добави в речника</button>` : ""}
    </div>`;
  pop.dataset.n = n;
  pop.hidden = false;

  const r = mark.getClientRects()[0] || mark.getBoundingClientRect();
  let left = r.left + window.scrollX, top = r.bottom + window.scrollY + 6;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  const pr = pop.getBoundingClientRect();
  if (pr.right > window.innerWidth - 8) pop.style.left = Math.max(8, window.innerWidth - pr.width - 8 + window.scrollX) + "px";
}

function closePopup() {
  pop.hidden = true;
  backdrop.querySelectorAll("mark.active").forEach(m => m.classList.remove("active"));
}

pop.addEventListener("mousedown", e => e.preventDefault());   // keep the textarea's caret
pop.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const i = issues[pop.dataset.n];
  if (b.dataset.s !== undefined) { replace([{start: i.start, end: i.end, with: b.dataset.s}]); return; }
  if (b.dataset.act === "ignore") { ignored.add(ignoreKey(i)); issues = issues.filter(x => x !== i); closePopup(); render(); }
  else if (b.dataset.act === "add") { $("extra").value = [...extraWords(), i.text].join(", "); closePopup(); run(); }
  else closePopup();
});

function onCaret() {
  if (ta.selectionStart !== ta.selectionEnd) return closePopup();
  const i = issueAt(ta.selectionStart);
  i ? openPopup(i) : closePopup();
}
ta.addEventListener("click", onCaret);
ta.addEventListener("keyup", e => { if (e.key.startsWith("Arrow") || e.key === "Home" || e.key === "End") onCaret(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
document.addEventListener("mousedown", e => { if (!pop.contains(e.target) && e.target !== ta) closePopup(); });
window.addEventListener("resize", () => { fit(); closePopup(); });

// ---- editing ----
function replace(replacements) {
  // Apply from the end so earlier offsets stay valid; skip overlaps.
  let text = ta.value, last = Infinity, caret = null;
  replacements.sort((a, b) => b.start - a.start).forEach(r => {
    if (r.end > last) return;
    text = text.slice(0, r.start) + r.with + text.slice(r.end);
    last = r.start;
    caret = r.start + r.with.length;
  });
  ta.value = text;
  closePopup();
  if (replacements.length === 1) { ta.focus(); ta.setSelectionRange(caret, caret); }
  render();
  run();
}

$("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr");
  if (!tr) return;
  const i = issues[tr.dataset.n];
  ta.focus(); ta.setSelectionRange(i.start, i.start);
  window.scrollTo({top: ta.getBoundingClientRect().top + window.scrollY - 40, behavior: "instant"});
  openPopup(i);
});

ta.addEventListener("input", () => {
  closePopup();
  render();                                    // drop stale underlines at once
  clearTimeout(timer); timer = setTimeout(run, 300);
});
$("fixall").onclick = async () => {
  const text = ta.value;
  const r = await fetch("/fix", {method: "POST", headers: {"Content-Type": "application/json"},
                                 body: JSON.stringify({text, extra: extraWords()})});
  const data = await r.json();
  if (!r.ok) { $("status").textContent = "Грешка: " + (data.error || r.status); return; }
  if (ta.value !== text) return;   // typed meanwhile
  ta.value = data.text;
  closePopup(); render(); run();
};
$("run").onclick = run;
$("extra").addEventListener("change", run);
render();
run();
</script>
</body>
</html>
